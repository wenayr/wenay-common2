apiVersion: v1
kind: Secret
metadata:
  name: wenay-mini-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MINI_TOKEN: {{ required "set secret.miniToken to the leader's DEMO_MINI_TOKEN" .Values.secret.miniToken | quote }}
  MINI_SECRET: {{ required "set secret.miniSecret to the leader's DEMO_MINI_SECRET" .Values.secret.miniSecret | quote }}
