# CI: build + publish gate + full oracle suite on Windows and Linux.
# The npm-script layer is node-based/cross-platform; both OSes run the identical chain.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: node scripts/run-oracles.mjs
